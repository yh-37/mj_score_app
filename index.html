<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
    <title>🀄 MJ-SCORE PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --emerald-50: #ecfdf5; --emerald-100: #d1fae5; --emerald-400: #34d399;
            --emerald-500: #10b981; --emerald-600: #059669; --emerald-700: #047857;
            --emerald-800: #065f46; --orange-400: #fb923c; --orange-500: #f97316;
            --blue-400: #60a5fa; --blue-500: #3b82f6; --slate-50: #f8fafc;
            --slate-100: #f1f5f9; --slate-200: #e2e8f0; --slate-300: #cbd5e1;
            --slate-400: #94a3b8; --slate-500: #64748b; --slate-600: #475569;
            --slate-800: #1e293b; --slate-900: #0f172a;
            --radius-lg: 16px; --radius-xl: 20px; --radius-2xl: 24px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -4px rgba(0, 0, 0, .1);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, .1), 0 8px 10px -6px rgba(0, 0, 0, .1);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--slate-100); color: var(--slate-900); min-height: 100dvh;
            -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
        }
        .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 100px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; font-style: italic; color: var(--emerald-800); }
        .tab-bar { display: flex; background: #fff; border-radius: var(--radius-xl); padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
        .tab-btn {
            flex: 1; padding: 12px 8px; border: none; background: transparent; border-radius: var(--radius-lg);
            font-size: 12px; font-weight: 800; color: var(--slate-400); cursor: pointer; transition: all .2s; letter-spacing: 1px;
        }
        .tab-btn.active { background: var(--emerald-600); color: #fff; box-shadow: 0 4px 6px rgba(5, 150, 105, .3); }
        .uma-bar {
            background: #fff; padding: 10px 16px; border-radius: var(--radius-xl); box-shadow: var(--shadow-sm);
            border: 1px solid var(--slate-200); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; overflow-x: auto;
        }
        .uma-label { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; }
        .uma-chips { display: flex; gap: 8px; align-items: center; }
        .uma-chip { display: flex; align-items: center; background: var(--slate-50); border-radius: 10px; padding: 4px 10px; border: 1px solid var(--slate-100); }
        .uma-chip input { width: 40px; background: transparent; border: none; text-align: center; font-weight: 700; font-size: 13px; color: var(--emerald-700); outline: none; }
        .panel { background: #fff; padding: 24px 20px; border-radius: var(--radius-2xl); box-shadow: var(--shadow-lg); margin-bottom: 24px; border-top: 8px solid var(--emerald-600); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .panel-title { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 3px; }
        .player-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .player-row { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: var(--radius-xl); transition: all .3s; }
        .player-row.active { background: var(--emerald-50); border: 1px solid var(--emerald-100); }
        .player-row.inactive { opacity: .35; filter: grayscale(1); }
        .player-name { width: 72px; background: transparent; border: none; font-size: 14px; font-weight: 700; outline: none; }
        .player-score { flex: 1; background: transparent; border: none; border-bottom: 2px solid var(--slate-200); text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 18px; outline: none; }
        .btn-confirm { width: 100%; padding: 16px; border-radius: var(--radius-xl); font-size: 12px; font-weight: 900; border: none; cursor: pointer; color: #fff; background: var(--emerald-600); box-shadow: var(--shadow-xl); }
        .btn-confirm:disabled { background: var(--slate-300); box-shadow: none; }
        .stats-view { animation: slideIn .3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .stat-card { background: #fff; border-radius: var(--radius-2xl); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .stat-card-title { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
        .chart-wrap { width: 100%; height: 200px; margin-top: 10px; position: relative; }
        canvas { width: 100% !important; height: 100% !important; }
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-item { background: var(--slate-50); padding: 12px; border-radius: var(--radius-lg); text-align: center; }
        .stat-val { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 18px; display: block; }
        .stat-label { font-size: 9px; color: var(--slate-400); font-weight: 800; text-transform: uppercase; }
        .history-card { background: var(--slate-900); border-radius: var(--radius-xl); padding: 16px; margin-bottom: 12px; border: 1px solid var(--slate-800); color: #fff; }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 800; }
        .history-results { display: flex; gap: 6px; flex-wrap: wrap; }
        .res-badge { padding: 4px 8px; border-radius: 6px; font-family: 'JetBrains Mono'; font-size: 10px; background: rgba(255, 255, 255, 0.1); }
        .summary-panel { background: var(--slate-900); border-radius: var(--radius-2xl); margin-bottom: 24px; overflow: hidden; color: #fff; padding: 16px; }
        .final-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .final-table th { color: rgba(255, 255, 255, 0.5); text-align: right; padding: 8px; font-size: 9px; }
        .final-table td { padding: 8px; text-align: right; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-family: 'JetBrains Mono'; }
        .final-table td:first-child { text-align: left; font-family: 'Inter'; }
        .btn-save-session { width: 100%; padding: 16px; background: var(--orange-500); color: #fff; border: none; border-radius: var(--radius-xl); font-weight: 900; font-size: 12px; margin-top: 15px; cursor: pointer; box-shadow: var(--shadow-lg); }
        .io-bar { display: flex; gap: 10px; margin-top: 20px; }
        .btn-io { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 10px; font-weight: 800; cursor: pointer; background: var(--slate-200); }

        /* ── CSV Loader Panel ── */
        .csv-panel-card { background: #fff; border-radius: var(--radius-2xl); padding: 16px 18px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .csv-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .csv-btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .btn-file-select {
            padding: 10px 8px; border-radius: 12px; border: 1.5px dashed var(--slate-300); background: var(--slate-50);
            font-size: 11px; font-weight: 800; color: var(--slate-600); cursor: pointer; text-align: center; transition: all .15s;
        }
        .btn-file-select:hover { border-color: var(--emerald-500); background: var(--emerald-50); color: var(--emerald-700); }
        .btn-direct-load {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--emerald-600);
            color: #fff; font-size: 11px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 10px rgba(5,150,105,.25);
        }

        /* ── Widgets ── */
        .group-filter-card { background: #fff; border-radius: var(--radius-2xl); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .player-selector-card { background: #fff; border-radius: var(--radius-2xl); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .player-selector-label { font-size: 9px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
        .player-selector-pills { display: flex; flex-wrap: wrap; gap: 7px; }
        .player-pill {
            padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--slate-200); background: var(--slate-50);
            font-size: 11px; font-weight: 800; color: var(--slate-500); cursor: pointer; transition: all .18s;
        }
        .player-pill:hover { border-color: var(--emerald-400); color: var(--emerald-700); background: var(--emerald-50); }
        .player-pill.active { background: var(--emerald-600); border-color: var(--emerald-600); color: #fff; box-shadow: 0 3px 8px rgba(5,150,105,.25); }
        .recent-alert-card { background: #fff; border-radius: var(--radius-2xl); padding: 16px 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .recent-alert-title { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .alert-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; margin-bottom: 10px; }
        .alert-badge.hot { background: rgba(251, 146, 60, 0.15); color: var(--orange-500); border: 1px solid rgba(251, 146, 60, 0.3); }
        .alert-badge.cold { background: rgba(96, 165, 250, 0.15); color: var(--blue-500); border: 1px solid rgba(96, 165, 250, 0.3); }
        .alert-badge.neutral { background: var(--slate-100); color: var(--slate-500); border: 1px solid var(--slate-200); }
        .recent-rank-dots { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
        .rank-dot { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
        .rank-dot.r1 { background: rgba(251,146,60,0.18); color: var(--orange-500); }
        .rank-dot.r2 { background: rgba(96,165,250,0.15); color: var(--blue-500); }
        .rank-dot.r3 { background: rgba(148,163,184,0.15); color: var(--slate-500); }
        .rank-dot.r4 { background: rgba(71,85,105,0.15); color: var(--slate-600); }
        .recent-mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .recent-mini-item { background: var(--slate-50); border-radius: 12px; padding: 10px 8px; text-align: center; }
        .recent-mini-val { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 15px; display: block; }
        .recent-mini-label { font-size: 8px; color: var(--slate-400); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .monthly-chart-card { background: #fff; border-radius: var(--radius-2xl); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); }
        .monthly-chart-title { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .monthly-chart-wrap { width: 100%; height: 180px; position: relative; }
        .daily-summary-card { background: #fff; border-radius: var(--radius-2xl); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); overflow: hidden; }
        .daily-summary-title { font-size: 10px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .daily-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .daily-table th { font-size: 8px; font-weight: 900; color: var(--slate-400); text-transform: uppercase; letter-spacing: 1px; padding: 6px 8px; border-bottom: 2px solid var(--slate-100); text-align: center; white-space: nowrap; }
        .daily-table th:first-child { text-align: left; }
        .daily-table td { padding: 8px; border-bottom: 1px solid var(--slate-100); font-family: 'JetBrains Mono', monospace; font-size: 11px; text-align: center; white-space: nowrap; }
        .daily-table td:first-child { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 10px; color: var(--slate-600); text-align: left; }
        .daily-table tr:last-child td { border-bottom: none; }
        .daily-table .score-pos { color: var(--orange-500); font-weight: 700; }
        .daily-table .score-neg { color: var(--blue-500); font-weight: 700; }
        .daily-table .score-zero { color: var(--slate-400); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); z-index: 1000; display: flex; align-items: flex-end; animation: fadeInBg .2s ease; }
        .modal-sheet { background: var(--slate-900); width: 100%; max-height: 90dvh; border-radius: 24px 24px 0 0; overflow-y: auto; padding: 16px 20px 48px; color: #fff; animation: slideUp .3s cubic-bezier(.32, .72, 0, 1); }
        .modal-handle { width: 40px; height: 4px; background: rgba(255, 255, 255, 0.18); border-radius: 2px; margin: 0 auto 20px; }
        .modal-section-title { font-size: 9px; font-weight: 900; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 2px; margin: 20px 0 10px; }
        .rank-bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .rank-bar-label { font-size: 11px; font-weight: 700; width: 28px; text-align: center; }
        .rank-bar-bg { flex: 1; height: 10px; background: rgba(255, 255, 255, 0.08); border-radius: 5px; overflow: hidden; }
        .rank-bar-fill { height: 100%; border-radius: 5px; transition: width .6s ease; }
        .rank-bar-count { font-size: 10px; font-family: 'JetBrains Mono'; color: rgba(255, 255, 255, 0.5); width: 48px; text-align: right; }
        .modal-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
        .modal-stat-item { background: rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 10px 8px; text-align: center; }
        .modal-stat-val { font-family: 'JetBrains Mono'; font-weight: 700; font-size: 16px; display: block; }
        .modal-stat-label { font-size: 8px; color: rgba(255, 255, 255, 0.4); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .rank-avg-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .rank-avg-table th { color: rgba(255, 255, 255, 0.4); font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; padding: 6px 8px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .rank-avg-table td { padding: 8px; text-align: center; font-family: 'JetBrains Mono'; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        @keyframes fadeInBg { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <span class="logo">🀄 MJ-SCORE</span>
            <button class="tab-btn" style="width: auto; padding: 6px 12px; border: 1px solid var(--slate-300);"
                onclick="resetAll()">RESET</button>
        </header>

        <div class="tab-bar">
            <button class="tab-btn active" id="tab-game" onclick="switchTab('game')">SCORE</button>
            <button class="tab-btn" id="tab-stats" onclick="switchTab('stats')">STATS</button>
        </div>

        <div id="view-game">
            <div id="uma-container"></div>
            <div id="main-panel-container"></div>
            <div id="history-container"></div>
        </div>

        <div id="view-stats" class="stats-view" style="display:none">
            <!-- CSVインポート・コントロール -->
            <div class="csv-panel-card">
                <div class="csv-panel-header">
                    <span class="player-selector-label" style="margin:0;">📊 CSV データ読込</span>
                    <span id="load-status-badge" style="font-size:9px; font-weight:800; color:var(--emerald-600);"></span>
                </div>
                
                <div class="csv-btn-grid">
                    <button class="btn-file-select" onclick="document.getElementById('csv-score-input').click()">
                        📄 set_res_new.csv<br><span style="font-size:8px;color:var(--slate-400);">対局スコアを選択</span>
                    </button>
                    <button class="btn-file-select" onclick="document.getElementById('csv-chip-input').click()">
                        🪙 chip.csv<br><span style="font-size:8px;color:var(--slate-400);">チップファイルを選択</span>
                    </button>
                </div>
                <input type="file" id="csv-score-input" accept=".csv,.tsv" style="display:none" onchange="importScoreCsv(event)">
                <input type="file" id="csv-chip-input" accept=".csv,.tsv" style="display:none" onchange="importChipCsv(event)">

                <button class="btn-direct-load" id="btn-auto-load" onclick="autoLoadBothCsvs()">
                    🔄 set_res_new.csv &amp; chip.csv を直接読込
                </button>
            </div>

            <div id="import-info" style="display:none"></div>

            <!-- グループ（member）セレクター -->
            <div id="group-selector-container"></div>

            <!-- プレイヤー選択 -->
            <div id="player-selector-container"></div>

            <!-- 直近20局 調子サマリー -->
            <div id="recent-stats-container"></div>

            <!-- 月別スコア推移グラフ -->
            <div id="monthly-chart-container"></div>

            <!-- 日別集計テーブル -->
            <div id="daily-summary-container"></div>

            <div class="stat-card">
                <div class="stat-card-title">Cumulative Trend</div>
                <div class="chart-wrap">
                    <canvas id="chart-trend"></canvas>
                </div>
            </div>
            <div id="stats-summary-container"></div>
            <div class="stat-card">
                <div class="stat-card-title">Archive History</div>
                <div id="archive-list"></div>
                <div class="io-bar">
                    <button class="btn-io" onclick="exportData()">EXPORT JSON</button>
                </div>
            </div>
        </div>
    </div>

    <div id="player-modal" class="modal-overlay" style="display:none" onclick="closePlayerModal(event)">
        <div class="modal-sheet" id="modal-sheet">
            <div class="modal-handle"></div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        /* ── State ── */
        let state = {
            view: 'game',
            members: JSON.parse(localStorage.getItem('mj-members') || '["P1","P2","P3","P4","P5","P6"]'),
            history: JSON.parse(localStorage.getItem('mj-history') || '[]'),
            chips: JSON.parse(localStorage.getItem('mj-chips') || '{}'),
            archives: JSON.parse(localStorage.getItem('mj-archives-v7') || '[]'),
            gameMode: 4,
            uma: { 1: 30, 2: 10, 3: -10, 4: -30 },
            activePlayers: [],
            currentPoints: {},
            editingIndex: null,
            scoreMult: parseFloat(localStorage.getItem('mj-mult-s') || '1'),
            chipMult: parseFloat(localStorage.getItem('mj-mult-c') || '1'),
            scoreRate: parseFloat(localStorage.getItem('mj-rate-s') || '100'),
            chipRate: parseFloat(localStorage.getItem('mj-rate-c') || '100'),
            totalPlayers: parseInt(localStorage.getItem('mj-total-players') || '6'),
            baseFee: parseFloat(localStorage.getItem('mj-base-fee') || '0'),
            selectedGroup: 'ALL'
        };
        state.activePlayers = state.members.slice(0, state.totalPlayers);

        function save() {
            localStorage.setItem('mj-members', JSON.stringify(state.members));
            localStorage.setItem('mj-history', JSON.stringify(state.history));
            localStorage.setItem('mj-chips', JSON.stringify(state.chips));
            localStorage.setItem('mj-archives-v7', JSON.stringify(state.archives));
            localStorage.setItem('mj-mult-s', state.scoreMult);
            localStorage.setItem('mj-mult-c', state.chipMult);
            localStorage.setItem('mj-rate-s', state.scoreRate);
            localStorage.setItem('mj-rate-c', state.chipRate);
            localStorage.setItem('mj-total-players', state.totalPlayers);
            localStorage.setItem('mj-base-fee', state.baseFee);
        }

        /* ── CSV Parsing Engine ── */
        function parseCsv(text) {
            const lines = text.split(/\r\n|\n|\r/).filter(l => l.trim().length > 0);
            if (lines.length === 0) return [];
            const delimiter = lines[0].includes('\t') ? '\t' : ',';
            const headers = lines[0].split(delimiter).map(h => h.trim().replace(/^["']|["']$/g, ''));

            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^["']|["']$/g, ''));
                if (cols.length >= headers.length) {
                    const row = {};
                    headers.forEach((h, idx) => row[h] = cols[idx]);
                    rows.push(row);
                }
            }
            return rows;
        }

        function buildArchivesFromSetResRows(scoreRows) {
            const sessionMap = new Map();
            scoreRows.forEach(r => {
                const rawDate = (r.date || '').trim();
                const date = rawDate.replace(/-/g, '/');
                const memberGroup = (r.member || 'General').trim();
                const sessionKey = `${date}_${memberGroup}`;

                if (!sessionMap.has(sessionKey)) {
                    sessionMap.set(sessionKey, {
                        id: `${date.replace(/\//g, '-')}_${memberGroup}`,
                        date: date,
                        group: memberGroup,
                        rule: r.rule || '',
                        roundsMap: new Map(),
                        playersSet: new Set(),
                        chips: {}
                    });
                }

                const s = sessionMap.get(sessionKey);
                const matchNum = parseInt(r.match || '1');
                if (!s.roundsMap.has(matchNum)) s.roundsMap.set(matchNum, []);

                const pName = r.name ? r.name.trim() : '';
                if (pName) {
                    s.playersSet.add(pName);
                    const rawVal = r.score !== '' && r.score !== undefined && !isNaN(Number(r.score)) ? Number(r.score) : undefined;
                    s.roundsMap.get(matchNum).push({
                        name: pName,
                        finalScore: parseFloat(r.point || '0'),
                        raw: rawVal,
                        rank: parseInt(r.rank || '0')
                    });
                }
            });

            const archives = [];
            sessionMap.forEach(s => {
                const history = [];
                const sortedMatches = [...s.roundsMap.keys()].sort((a, b) => a - b);
                sortedMatches.forEach(m => history.push(s.roundsMap.get(m)));

                archives.push({
                    id: s.id,
                    date: s.date,
                    group: s.group,
                    players: [...s.playersSet],
                    history: history,
                    chips: s.chips || {}
                });
            });

            archives.sort((a, b) => new Date(b.date) - new Date(a.date));
            return archives;
        }

        function mergeChipsIntoArchives(chipRows) {
            let updateCount = 0;
            chipRows.forEach(r => {
                const date = (r.date || '').replace(/-/g, '/').trim();
                const group = (r.member || '').trim();

                state.archives.forEach(arc => {
                    const dateMatch = arc.date === date;
                    const groupMatch = !group || arc.group === group;
                    if (dateMatch && groupMatch) {
                        if (!arc.chips) arc.chips = {};
                        if (r.name && r.chip !== undefined) {
                            arc.chips[r.name.trim()] = Number(r.chip) || 0;
                            updateCount++;
                        } else {
                            Object.keys(r).forEach(k => {
                                if (k !== 'date' && k !== 'member') {
                                    arc.chips[k.trim()] = Number(r[k]) || 0;
                                    updateCount++;
                                }
                            });
                        }
                    }
                });
            });
            return updateCount;
        }

        /* ── Auto & File Loaders ── */
        async function autoLoadBothCsvs() {
            const btn = document.getElementById('btn-auto-load');
            if (btn) { btn.disabled = true; btn.textContent = '読み込み中…'; }

            try {
                // Try multiple paths (direct path or result/ folder)
                const fetchWithFallback = async (filenames) => {
                    for (const fn of filenames) {
                        try {
                            const res = await fetch(fn + '?_t=' + Date.now());
                            if (res.ok) return await res.text();
                        } catch (e) {}
                    }
                    throw new Error(`ファイルが見つかりません: ${filenames[0]}`);
                };

                const [scoreText, chipText] = await Promise.all([
                    fetchWithFallback(['set_res_new.csv', 'result/set_res_new.csv']),
                    fetchWithFallback(['chip.csv', 'result/chip.csv'])
                ]);

                const scoreRows = parseCsv(scoreText);
                const chipRows = parseCsv(chipText);

                state.archives = buildArchivesFromSetResRows(scoreRows);
                const chipUpdates = mergeChipsIntoArchives(chipRows);

                const allPlayers = [...new Set(state.archives.flatMap(a => a.players))];
                if (allPlayers.length > 0) {
                    state.members = allPlayers;
                    state.activePlayers = allPlayers.slice(0, state.totalPlayers);
                }
                save();

                const infoDiv = document.getElementById('import-info');
                const totalRounds = state.archives.reduce((s, a) => s + a.history.length, 0);
                infoDiv.style.display = 'block';
                infoDiv.innerHTML = `
                    <div class="stat-card" style="border-left:4px solid var(--emerald-500);padding:14px 16px;">
                        <div style="font-size:11px;font-weight:800;color:var(--emerald-700);margin-bottom:6px;">✅ CSV読込完了</div>
                        <div style="font-size:10px;color:var(--slate-500);line-height:1.8;">
                            📅 <b>${state.archives.length}</b> セッション / 🀄 <b>${totalRounds}</b> 半荘<br>
                            🪙 チップ反映: <b>${chipUpdates}</b> 件<br>
                            👥 プレイヤー: ${allPlayers.join(', ')}
                        </div>
                    </div>`;

                render();
                drawTrendChart();

                if (btn) { btn.textContent = '✅ 読込完了'; setTimeout(() => { btn.disabled = false; btn.textContent = '🔄 set_res_new.csv & chip.csv を直接読込'; }, 2000); }
            } catch (e) {
                alert('読み込みに失敗しました:\n' + e.message + '\n\n端末内のファイルを選択ボタンをご利用ください。');
                if (btn) { btn.disabled = false; btn.textContent = '🔄 set_res_new.csv & chip.csv を直接読込'; }
            }
        }

        function importScoreCsv(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const scoreRows = parseCsv(reader.result);
                const prevChips = new Map();
                state.archives.forEach(a => { if (a.chips) prevChips.set(a.id, a.chips); });

                state.archives = buildArchivesFromSetResRows(scoreRows);
                state.archives.forEach(a => { if (prevChips.has(a.id)) a.chips = prevChips.get(a.id); });

                const allPlayers = [...new Set(state.archives.flatMap(a => a.players))];
                if (allPlayers.length > 0) {
                    state.members = allPlayers;
                    state.activePlayers = allPlayers.slice(0, state.totalPlayers);
                }
                save();
                render();
                drawTrendChart();
                alert(`${file.name} を読み込みました（${state.archives.length}セッション）`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function importChipCsv(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                const chipRows = parseCsv(reader.result);
                const count = mergeChipsIntoArchives(chipRows);
                save();
                render();
                alert(`${file.name} を反映しました（${count}件更新）`);
            };
            reader.readAsText(file);
            event.target.value = '';
        }

            if (!state.selectedGroup || state.selectedGroup === 'ALL') return state.archives;

        function getStatsPlayers() {
            const archives = getFilteredArchives();
            const seen = new Set();
            const players = [];
            [...archives].reverse().forEach(arc => {
                arc.history.forEach(round => {
                    round.forEach(p => {
                        if (p.rank !== undefined && !seen.has(p.name)) {
                            seen.add(p.name);
                            players.push(p.name);
                        }
                    });
                });
            });
            return players.length > 0 ? players : state.members;
        }

        /* ── Trend Chart ── */
        function drawTrendChart() {
            const canvas = document.getElementById('chart-trend');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            canvas.width = w * 2; canvas.height = h * 2;
            ctx.scale(2, 2);

            const archives = getFilteredArchives();
            if (archives.length === 0) return;

            const players = getStatsPlayers();
            const colors = ['#fb923c', '#60a5fa', '#34d399', '#a78bfa', '#f43f5e', '#fbbf24'];

            let data = players.map(() => [0]);
            [...archives].reverse().forEach(arc => {
                players.forEach((name, i) => {
                    const sessionTotal = arc.history.reduce((sum, r) => sum + (r.find(e => e.name === name)?.finalScore || 0), 0);
                    const lastVal = data[i][data[i].length - 1];
                    data[i].push(lastVal + sessionTotal);
                });
            });

            const maxPoints = Math.max(...data.flat(), 50);
            const minPoints = Math.min(...data.flat(), -50);
            const range = maxPoints - minPoints || 1;
            const stepX = w / (data[0].length - 1 || 1);

            ctx.clearRect(0, 0, w, h);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const zeroY = h - ((0 - minPoints) / range) * h;
            ctx.moveTo(0, zeroY); ctx.lineTo(w, zeroY);
            ctx.stroke();

            data.forEach((points, pi) => {
                ctx.strokeStyle = colors[pi % colors.length];
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.beginPath();
                points.forEach((p, i) => {
                    const x = i * stepX;
                    const y = h - ((p - minPoints) / range) * h;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                });
                ctx.stroke();
            });
        }

        function getPlayerRounds(name) {
            const rounds = [];
            const archives = getFilteredArchives();
            [...archives].reverse().forEach(arc => {
                arc.history.forEach(round => {
                    const p = round.find(r => r.name === name && r.rank !== undefined);
                    if (p) rounds.push({ finalScore: p.finalScore, rank: p.rank, date: arc.date, arcId: arc.id });
                });
            });
            return rounds;
        }

        function aggregateByDate(name) {
            const map = new Map();
            const archives = getFilteredArchives();
            [...archives].reverse().forEach(arc => {
                const dateKey = arc.date;
                if (!map.has(dateKey)) map.set(dateKey, { date: dateKey, games: 0, total: 0, tops: 0, rankSum: 0 });
                const entry = map.get(dateKey);
                arc.history.forEach(round => {
                    const p = round.find(r => r.name === name && r.rank !== undefined);
                    if (p) {
                        entry.games++;
                        entry.total += p.finalScore;
                        entry.rankSum += p.rank;
                        if (p.rank === 1) entry.tops++;
                    }
                });
            });
            return [...map.values()]
                .filter(e => e.games > 0)
                .map(e => ({ ...e, avg: e.games > 0 ? e.total / e.games : 0, avgRank: e.games > 0 ? e.rankSum / e.games : 0 }))
                .reverse();
        }

        function aggregateByMonth(name) {
            const map = new Map();
            const archives = getFilteredArchives();
            [...archives].reverse().forEach(arc => {
                const parts = arc.date.replace(/\//g, '-').split('-');
                const month = `${parts[0]}/${String(parts[1]).padStart(2, '0')}`;
                if (!map.has(month)) map.set(month, { month, total: 0, games: 0 });
                const entry = map.get(month);
                arc.history.forEach(round => {
                    const p = round.find(r => r.name === name && r.rank !== undefined);
                    if (p) { entry.total += p.finalScore; entry.games++; }
                });
            });
            return [...map.values()].filter(e => e.games > 0);
        }

        function getRecentStats(name, count = 20) {
            const all = getPlayerRounds(name);
            const recent = all.slice(-count);
            if (recent.length === 0) return null;

            const total = recent.reduce((s, r) => s + r.finalScore, 0);
            const avg = total / recent.length;
            const tops = recent.filter(r => r.rank === 1).length;
            const lasts = recent.filter(r => r.rank === 4).length;
            const avgRank = recent.reduce((s, r) => s + r.rank, 0) / recent.length;

            let consecTop = 0, consecLast = 0;
            for (let i = recent.length - 1; i >= 0; i--) {
                if (recent[i].rank === 1) consecTop++; else break;
            }
            for (let i = recent.length - 1; i >= 0; i--) {
                if (recent[i].rank === 4) consecLast++; else break;
            }

            return { recent, total, avg, tops, lasts, avgRank, consecTop, consecLast };
        }

        function renderMonthlyChart(name) {
            const cont = document.getElementById('monthly-chart-container');
            if (!cont) return;
            const monthlyData = aggregateByMonth(name);
            if (monthlyData.length === 0) { cont.innerHTML = ''; return; }

            cont.innerHTML = `
                <div class="monthly-chart-card">
                    <div class="monthly-chart-title">📅 Monthly Score · ${name}</div>
                    <div class="monthly-chart-wrap">
                        <canvas id="chart-monthly"></canvas>
                    </div>
                </div>`;

            requestAnimationFrame(() => {
                const canvas = document.getElementById('chart-monthly');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 2;
                const w = canvas.offsetWidth;
                const h = canvas.offsetHeight;
                canvas.width = w * dpr; canvas.height = h * dpr;
                ctx.scale(dpr, dpr);

                const n = monthlyData.length;
                const values = monthlyData.map(d => d.total);
                const absMax = Math.max(Math.abs(Math.max(...values, 1)), Math.abs(Math.min(...values, -1)));
                const padL = 4, padR = 4, padT = 20, padB = 30;
                const chartW = w - padL - padR;
                const chartH = h - padT - padB;
                const barW = Math.max(4, Math.floor(chartW / n) - 4);
                const gap = (chartW - barW * n) / (n + 1);
                const zeroY = padT + chartH / 2;
                const toBarH = v => absMax > 0 ? Math.abs(v) / absMax * (chartH / 2 - 4) : 2;

                ctx.strokeStyle = 'rgba(100,116,139,0.2)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(padL, zeroY); ctx.lineTo(w - padR, zeroY);
                ctx.stroke();

                monthlyData.forEach((d, i) => {
                    const x = padL + gap + i * (barW + gap);
                    const bh = Math.max(2, toBarH(d.total));
                    const isPos = d.total >= 0;
                    const y = isPos ? zeroY - bh : zeroY;

                    ctx.fillStyle = isPos ? 'rgba(16,185,129,0.85)' : 'rgba(96,165,250,0.85)';
                    ctx.fillRect(x, y, barW, bh);

                    ctx.fillStyle = isPos ? '#059669' : '#3b82f6';
                    ctx.font = 'bold 8px JetBrains Mono';
                    ctx.textAlign = 'center';
                    ctx.fillText((isPos ? '+' : '') + d.total.toFixed(0), x + barW / 2, isPos ? y - 3 : y + bh + 10);

                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '700 7px Inter';
                    ctx.fillText(d.month.split('/')[1] + '月', x + barW / 2, h - padB + 14);
                });
            });
        }

        /* ── Game Panel Core ── */
        function calculateScore() {
            let participants = state.activePlayers.map(name => ({
                name, rawPoint: parseInt(state.currentPoints[name] || 0)
            })).sort((a, b) => b.rawPoint - a.rawPoint);

            const getBase = p => Math.round((p - 30000) / 1000);
            let results = [], rank = 1;
            for (let i = 0; i < participants.length; i++) {
                let group = [participants[i]];
                while (i + 1 < participants.length && participants[i + 1].rawPoint === participants[i].rawPoint) group.push(participants[++i]);
                let sumUma = 0;
                for (let j = 0; j < group.length; j++) sumUma += state.uma[rank + j];
                let avgUma = sumUma / group.length;
                group.forEach(p => results.push({ ...p, rank, score: getBase(p.rawPoint) + avgUma }));
                rank += group.length;
            }
            let othersTotal = results.filter(r => r.rank !== 1).reduce((s, r) => s + r.score, 0);
            let topCount = results.filter(r => r.rank === 1).length;
            results.forEach(r => { if (r.rank === 1) r.score = (othersTotal * -1) / topCount; });

            const round = state.members.map(name => {
                const p = results.find(r => r.name === name);
                return p ? { name, finalScore: p.score, raw: p.rawPoint, rank: p.rank } : { name, finalScore: 0 };
            });

            if (state.editingIndex !== null) { state.history[state.editingIndex] = round; state.editingIndex = null; }
            else state.history.push(round);

            state.currentPoints = {};
            save(); render();
        }

        function archiveSession() {
            if (!confirm("セッションを終了して保存しますか？")) return;
            const session = {
                id: new Date().toISOString(),
                date: new Date().toLocaleDateString('ja-JP'),
                group: 'Current',
                players: [...state.activePlayers],
                history: [...state.history],
                chips: { ...state.chips }
            };
            state.archives.unshift(session);
            state.history = [];
            state.chips = {};
            save();
            switchTab('stats');
        }

        function render() {
            if (state.view === 'game') renderGame();
            else renderStats();
        }

        function renderGame() {
            const umaCont = document.getElementById('uma-container');
            umaCont.innerHTML = `<div class="uma-bar"><span class="uma-label">Uma</span><div class="uma-chips" id="uma-list"></div></div>`;
            for (let i = 1; i <= state.gameMode; i++) {
                const chip = document.createElement('div');
                chip.className = 'uma-chip';
                chip.innerHTML = `<span>${i}位</span><input type="number" value="${state.uma[i]}" onchange="state.uma[${i}]=Number(this.value);render()">`;
                umaCont.querySelector('#uma-list').appendChild(chip);
            }

            const panelCont = document.getElementById('main-panel-container');
            panelCont.innerHTML = `
                <div class="uma-bar" style="gap:12px;">
                    <span class="uma-label" style="white-space:nowrap">Rate</span>
                    <div class="uma-chip" style="gap:4px">
                        <span style="font-size:9px;color:var(--slate-400)">スコア</span>
                        <input type="number" style="width:52px;color:var(--emerald-700);font-weight:700;" value="${state.scoreRate}" onchange="state.scoreRate=parseFloat(this.value)||0;save();if(state.history.length>0)renderHistoryTable();">
                        <span style="font-size:9px;color:var(--slate-400)">円/点</span>
                    </div>
                    <div class="uma-chip" style="gap:4px">
                        <span style="font-size:9px;color:var(--slate-400)">チップ</span>
                        <input type="number" style="width:52px;color:#7c3aed;font-weight:700;" value="${state.chipRate}" onchange="state.chipRate=parseFloat(this.value)||0;save();if(state.history.length>0)renderHistoryTable();">
                        <span style="font-size:9px;color:var(--slate-400)">円/枚</span>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header" style="margin-bottom:12px">
                        <span class="panel-title">${state.editingIndex !== null ? 'EDIT ROUND' : 'ENTRY'}</span>
                        <div style="display:flex;gap:4px">
                            <button class="tab-btn ${state.gameMode == 3 ? 'active' : ''}" onclick="state.gameMode=3;render()">3麻</button>
                            <button class="tab-btn ${state.gameMode == 4 ? 'active' : ''}" onclick="state.gameMode=4;render()">4麻</button>
                        </div>
                    </div>

                    ${state.editingIndex === null ? `
                    <div style="display:flex;align-items:center;gap:8px;background:var(--slate-50);border-radius:16px;padding:8px 12px;margin-bottom:16px;">
                        <span style="font-size:10px;font-weight:900;color:var(--slate-400)">参加人数:</span>
                        <div style="display:flex;gap:6px">
                            ${[4,5,6].map(n => `<button onclick="setTotalPlayers(${n})" style="width:36px;height:36px;border-radius:12px;border:${state.totalPlayers===n?'none':'1px solid var(--slate-200)'};background:${state.totalPlayers===n?'var(--emerald-600)':'#fff'};color:${state.totalPlayers===n?'#fff':'var(--slate-400)'};font-size:11px;font-weight:900;cursor:pointer;">${n}人</button>`).join('')}
                        </div>
                    </div>` : ''}

                    <div class="player-list" id="p-list"></div>
                    <button class="btn-confirm" ${state.activePlayers.length != state.gameMode ? 'disabled' : ''} onclick="calculateScore()">
                        ${state.editingIndex !== null ? 'UPDATE' : 'CONFIRM ROUND'}
                    </button>
                </div>
            `;
            const plist = panelCont.querySelector('#p-list');
            state.members.forEach((name, i) => {
                const active = state.activePlayers.includes(name);
                const disabled = i >= state.totalPlayers;
                const row = document.createElement('div');
                row.className = `player-row ${disabled ? 'inactive' : active ? 'active' : 'inactive'}`;
                if (disabled) row.style.opacity = '0.15';
                row.innerHTML = `
                    <button class="tab-btn ${active && !disabled ? 'active' : ''}" style="width:30px;padding:8px" ${disabled ? 'disabled' : ''} onclick="${disabled ? '' : `togglePlayer('${name}')`}">${active && !disabled ? '✔' : '+'}</button>
                    <input class="player-name" value="${name}" ${disabled ? 'disabled' : ''} onchange="renamePlayer(${i}, this.value)">
                    <input type="number" class="player-score" placeholder="0" ${!active || disabled ? 'disabled' : ''} value="${state.currentPoints[name] || ''}" oninput="state.currentPoints['${name}']=this.value">
                `;
                plist.appendChild(row);
            });

            if (state.history.length > 0) renderHistoryTable();
        }

        function renderHistoryTable() {
            const cont = document.getElementById('history-container');
            const feePerPerson = (state.baseFee > 0 && state.totalPlayers > 0) ? Math.ceil(state.baseFee / state.totalPlayers) : 0;

            cont.innerHTML = `
                <div class="summary-panel">
                    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
                        <table class="final-table" style="color:#fff;min-width:${Math.max(280, 90 + state.history.length * 56 + 72)}px">
                            <thead id="h-head"></thead>
                            <tbody id="h-body"></tbody>
                        </table>
                    </div>
                    <div style="margin-top:20px; border-top:1px solid rgba(255,255,255,0.1); padding-top:16px;">
                        <div style="font-size:10px; font-weight:900; color:rgba(255,255,255,0.5); text-transform:uppercase; margin-bottom:12px;">Chip Input</div>
                        <div id="chip-input-container" style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px;"></div>
                    </div>
                    <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;">
                        <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.05);border-radius:12px;padding:10px 14px;">
                            <span style="font-size:10px;font-weight:900;color:#fbbf24;">🏠 場代</span>
                            <input type="number" placeholder="0" value="${state.baseFee || ''}"
                                style="width:88px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fcd34d;text-align:center;"
                                oninput="state.baseFee=parseFloat(this.value)||0;save();renderHistoryTable();">
                            <span style="font-size:10px;color:rgba(255,255,255,0.4);">円 ÷ ${state.totalPlayers}人</span>
                        </div>
                    </div>
                    <div style="margin-top:16px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;">
                        <div style="font-size:10px;font-weight:900;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:12px;">💴 Final Amount</div>
                        <div id="final-amount-container"></div>
                    </div>
                    <button class="btn-save-session" onclick="archiveSession()">FINALIZE &amp; SAVE SESSION</button>
                </div>
            `;

            const head = cont.querySelector('#h-head');
            const thr = document.createElement('tr');
            thr.innerHTML = `<th style="text-align:left;position:sticky;left:0;background:#0f172a;z-index:1;min-width:72px;">Player</th>`;
            state.history.forEach((_, i) => {
                const th = document.createElement('th');
                th.textContent = `#${i + 1}`;
                th.onclick = () => editRound(i);
                thr.appendChild(th);
            });
            const thTot = document.createElement('th');
            thTot.textContent = 'TOTAL';
            thr.appendChild(thTot);
            head.appendChild(thr);

            const body = cont.querySelector('#h-body');
            state.members.forEach(name => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td style="position:sticky;left:0;background:#0f172a;z-index:1;font-weight:700;">${name}</td>`;
                let total = 0;
                state.history.forEach(round => {
                    const s = (round.find(r => r.name === name) || {}).finalScore || 0;
                    total += s;
                    const td = document.createElement('td');
                    td.style.color = s > 0 ? 'var(--orange-400)' : s < 0 ? 'var(--blue-400)' : 'rgba(255,255,255,0.3)';
                    td.textContent = s.toFixed(1);
                    tr.appendChild(td);
                });
                const tdTotal = document.createElement('td');
                tdTotal.style.fontWeight = '900';
                tdTotal.textContent = total.toFixed(1);
                tr.appendChild(tdTotal);
                body.appendChild(tr);
            });

            const chipCont = cont.querySelector('#chip-input-container');
            state.members.slice(0, state.totalPlayers).forEach(name => {
                const item = document.createElement('div');
                item.style.cssText = 'background:rgba(255,255,255,0.05); padding:8px 10px; border-radius:12px; display:flex; align-items:center;';
                item.innerHTML = `
                    <span style="font-size:11px; flex:1;">${name}</span>
                    <input type="number" placeholder="0"
                        style="width:50px; background:transparent; border:none; border-bottom:1px solid rgba(255,255,255,0.2); color:#c4b5fd; text-align:right;"
                        value="${state.chips[name] || ''}"
                        oninput="state.chips['${name}']=Number(this.value);renderFinalAmounts();">
                `;
                chipCont.appendChild(item);
            });

            renderFinalAmounts();
        }

        function renderFinalAmounts() {
            const cont = document.getElementById('final-amount-container');
            if (!cont) return;
            const feePerPerson = (state.baseFee > 0 && state.totalPlayers > 0) ? Math.ceil(state.baseFee / state.totalPlayers) : 0;
            cont.innerHTML = '';
            state.members.slice(0, state.totalPlayers).forEach(name => {
                const total = state.history.reduce((s, r) => s + ((r.find(p => p.name === name) || {}).finalScore || 0), 0);
                const chip = Number(state.chips[name] || 0);
                const finalAmt = total * state.scoreRate + chip * state.chipRate;
                const netAmt = finalAmt - feePerPerson;
                const row = document.createElement('div');
                row.style.cssText = 'padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; justify-content:space-between; align-items:center;';
                row.innerHTML = `
                    <span style="font-size:12px;font-weight:700;">${name}</span>
                    <div style="font-size:13px;font-weight:900;font-family:'JetBrains Mono';color:${netAmt >= 0 ? 'var(--orange-400)' : 'var(--blue-400)'}">
                        ${netAmt >= 0 ? '+' : ''}${Math.round(netAmt).toLocaleString()}円
                    </div>
                `;
                cont.appendChild(row);
            });
        }

        function setTotalPlayers(n) {
            state.totalPlayers = n;
            state.activePlayers = state.activePlayers.filter((_, i) => i < n);
            save(); render();
        }

        function togglePlayer(name) {
            if (state.activePlayers.includes(name)) state.activePlayers = state.activePlayers.filter(p => p !== name);
            else if (state.activePlayers.length < state.gameMode) state.activePlayers.push(name);
            render();
        }

        function renamePlayer(idx, val) {
            const old = state.members[idx];
            state.members[idx] = val;
            state.activePlayers = state.activePlayers.map(p => p === old ? val : p);
            save(); render();
        }

        function editRound(idx) {
            state.editingIndex = idx;
            const round = state.history[idx];
            state.activePlayers = round.filter(r => r.raw !== undefined).map(r => r.name);
            state.currentPoints = {};
            round.forEach(r => { if (r.raw !== undefined) state.currentPoints[r.name] = r.raw; });
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteArchive(idx) {
            if (confirm("この履歴を削除しますか？")) {
                state.archives.splice(idx, 1);
                save(); render(); drawTrendChart();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(state.archives, null, 4)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mj_score_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function openPlayerModal(name) {
            const rounds = [];
            let chipTotal = 0;
            const archives = getFilteredArchives();

            archives.forEach(arc => {
                arc.history.forEach(round => {
                    const p = round.find(r => r.name === name && r.rank !== undefined);
                    if (p) rounds.push({ finalScore: p.finalScore, rank: p.rank, date: arc.date });
                });
                chipTotal += Number(arc.chips?.[name] || 0);
            });

            const totalScore = rounds.reduce((s, r) => s + r.finalScore, 0);
            const games = rounds.length;
            const avg = games > 0 ? (totalScore / games) : 0;
            const rankColors = ['', '#fb923c', '#60a5fa', '#94a3b8', '#475569'];
            const rankData = [1, 2, 3, 4].map(rank => {
                const rs = rounds.filter(r => r.rank === rank);
                return { rank, count: rs.length, avg: rs.length > 0 ? rs.reduce((s, r) => s + r.finalScore, 0) / rs.length : null };
            });

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <div style="margin-bottom:20px;">
                    <div style="font-size:22px; font-weight:900;">${name}</div>
                    <div style="font-size:12px; color:rgba(255,255,255,0.4);">${games}戦 / グループ: ${state.selectedGroup}</div>
                </div>
                <div class="modal-stat-grid">
                    <div class="modal-stat-item">
                        <span class="modal-stat-val" style="color:${totalScore >= 0 ? 'var(--orange-400)' : 'var(--blue-400)'}">${totalScore.toFixed(1)}</span>
                        <span class="modal-stat-label">Total</span>
                    </div>
                    <div class="modal-stat-item">
                        <span class="modal-stat-val">${avg.toFixed(2)}</span>
                        <span class="modal-stat-label">Avg/Game</span>
                    </div>
                    <div class="modal-stat-item">
                        <span class="modal-stat-val" style="color:${chipTotal >= 0 ? 'var(--emerald-400)' : '#f87171'}">${chipTotal >= 0 ? '+' : ''}${chipTotal}</span>
                        <span class="modal-stat-label">Chips</span>
                    </div>
                </div>
                <div class="modal-section-title">Rank Distribution</div>
                ${rankData.map(rd => `
                    <div class="rank-bar-row">
                        <span class="rank-bar-label" style="color:${rankColors[rd.rank]}">${rd.rank}位</span>
                        <div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${games > 0 ? (rd.count/games*100) : 0}%; background:${rankColors[rd.rank]};"></div></div>
                        <span class="rank-bar-count">${rd.count}回</span>
                    </div>
                `).join('')}
            `;

            document.getElementById('player-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePlayerModal(event) {
            if (event && event.target !== document.getElementById('player-modal')) return;
            document.getElementById('player-modal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function resetAll() {
            if (confirm("全データをリセットしますか？")) {
                localStorage.clear();
                location.reload();
            }
        }

        // 初期化：STATSタブ表示時に自動でCSV読み込みを試行
        render();
        autoLoadBothCsvs();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(console.error);
        }
    </script>
</body>

</html>
